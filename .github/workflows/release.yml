name: Release Second Brain (Linux & Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux .deb & .AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run contracts:build

      - name: Build desktop bundle with Tauri
        run: npm --prefix apps/desktop run tauri build

      - name: Collect Linux release artifacts
        run: |
          mkdir -p dist/linux
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb dist/linux/ || true
          cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage dist/linux/ || true
          ls -la dist/linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/linux/*

  build-android:
    name: Build Android .apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Android Release APK
        run: |
          cd apps/android
          gradle :app:assembleRelease --no-daemon

      - name: Collect Android release artifact
        run: |
          mkdir -p dist/android
          cp apps/android/app/build/outputs/apk/release/*.apk dist/android/second-brain-android.apk
          ls -la dist/android

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: dist/android/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: release-assets/

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-packages
          path: release-assets/

      - name: List Release Assets
        run: ls -la release-assets/

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Second Brain ${{ steps.release_tag.outputs.tag }}"
          body: |
            ## 🧠 Second Brain — Never lose a thought.
            
            Offline-first productivity app for Linux Mint Desktop and Android, synchronizing via Supabase.

            ### 📦 Downloads:
            - **Linux Mint / Ubuntu / Debian:** Download the `.deb` package below.
              ```bash
              sudo dpkg -i second-brain_*.deb
              ```
            - **Universal Linux AppImage:** Download the `.AppImage` package, make it executable (`chmod +x second-brain_*.AppImage`), and run directly.
            - **Android APK:** Download `second-brain-android.apk` to your phone and install/sideload.

            ### ✨ Key Features:
            - **Local-First SQLite Vault:** Fast, responsive, works completely offline without network latency.
            - **Tasks & Kanban Board:** Filter by status (To Do, In Progress, Completed), set priorities and deadlines.
            - **Idea Inbox:** Quick friction-free spark capture with instant search and archive.
            - **Learning Tracker:** Track courses, reading lists, study sessions, and progress percentages.
            - **Calendar & Schedule:** Date-based agenda review and daily task planning.
            - **Bidirectional Cloud Sync:** Seamless sync between Linux Mint and Android phone with Supabase backend.
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
